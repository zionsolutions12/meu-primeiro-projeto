<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem-vindo • Meu Primeiro Projeto 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05030f;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    #scene {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* Conteudo sobreposto à cena 3D */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      padding: 20px;
    }

    .badge-top {
      pointer-events: auto;
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #9d8bff;
      margin-bottom: 18px;
      opacity: 0;
      animation: fadeIn 1s ease-out 0.3s forwards;
    }

    h1 {
      font-size: clamp(2.2rem, 7vw, 5rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -1px;
      text-shadow: 0 0 40px rgba(120, 90, 255, 0.6);
      opacity: 0;
      animation: rise 1.1s cubic-bezier(.2,.8,.2,1) 0.5s forwards;
    }

    .grad {
      background: linear-gradient(90deg, #ffd86f, #ff7eb3, #7afcff, #9d8bff);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 6s linear infinite;
    }

    p.sub {
      max-width: 600px;
      margin-top: 22px;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.85);
      opacity: 0;
      animation: rise 1.1s cubic-bezier(.2,.8,.2,1) 0.8s forwards;
    }

    .cta {
      pointer-events: auto;
      margin-top: 38px;
      display: inline-block;
      padding: 16px 40px;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(135deg, #7c5cff, #ff5c9d);
      box-shadow: 0 10px 40px rgba(124, 92, 255, 0.5);
      border: 1px solid rgba(255,255,255,0.2);
      transition: transform .25s ease, box-shadow .25s ease;
      opacity: 0;
      animation: rise 1.1s cubic-bezier(.2,.8,.2,1) 1.1s forwards;
    }
    .cta:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 16px 55px rgba(255, 92, 157, 0.6);
    }

    .hint {
      position: fixed;
      bottom: 22px;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.45);
      pointer-events: none;
      opacity: 0;
      animation: fadeIn 1.2s ease-out 1.6s forwards;
    }

    /* Tela de carregamento */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05030f;
      transition: opacity .8s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 54px; height: 54px;
      border: 4px solid rgba(157,139,255,0.25);
      border-top-color: #9d8bff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer { to { background-position: 300% 0; } }
  </style>
</head>
<body>
  <div id="loader"><div class="spinner"></div></div>

  <canvas id="scene"></canvas>

  <div class="overlay">
    <div class="badge-top">✨ Ao vivo no vídeo ✨</div>
    <h1>E aí, <span class="grad">galera!</span><br>Bem-vindos ao 3D</h1>
    <p class="sub">
      Essa é a nova página inicial do <strong>Meu Primeiro Projeto</strong> —
      agora com uma cena 3D interativa feita com Three.js. Mexa o mouse pra
      explorar! 🚀
    </p>
    <a class="cta" href="https://github.com/zionsolutions12/meu-primeiro-projeto" target="_blank" rel="noopener">Ver o projeto no GitHub</a>
  </div>

  <div class="hint">🖱️ Mova o mouse para interagir • role para ver de outro ângulo</div>

  <!-- Three.js via importmap (modulos ES) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('scene');
    const loader = document.getElementById('loader');

    // --- Renderer ---
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    // --- Scene + Camera ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05030f, 0.045);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 9);

    // --- Iluminacao ---
    scene.add(new THREE.AmbientLight(0x404060, 1.2));

    const keyLight = new THREE.PointLight(0x7c5cff, 120, 60);
    keyLight.position.set(6, 6, 8);
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0xff5c9d, 90, 60);
    rimLight.position.set(-7, -4, 4);
    scene.add(rimLight);

    const topLight = new THREE.PointLight(0x7afcff, 70, 60);
    topLight.position.set(0, 8, -3);
    scene.add(topLight);

    // --- Grupo central de objetos 3D flutuantes ---
    const group = new THREE.Group();
    scene.add(group);

    // Objeto principal: um icosaedro "joia" com material fisico
    const coreGeo = new THREE.IcosahedronGeometry(2, 1);
    const coreMat = new THREE.MeshPhysicalMaterial({
      color: 0x8a6cff,
      metalness: 0.35,
      roughness: 0.15,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      flatShading: true,
      emissive: 0x2a1a66,
      emissiveIntensity: 0.4
    });
    const core = new THREE.Mesh(coreGeo, coreMat);
    group.add(core);

    // Wireframe luminoso por cima do nucleo
    const wireGeo = new THREE.IcosahedronGeometry(2.05, 1);
    const wireMat = new THREE.MeshBasicMaterial({ color: 0x9afcff, wireframe: true, transparent: true, opacity: 0.18 });
    const wire = new THREE.Mesh(wireGeo, wireMat);
    group.add(wire);

    // Aneis orbitais (torus) em angulos diferentes
    const ringColors = [0xff5c9d, 0x7afcff, 0xffd86f];
    const rings = [];
    ringColors.forEach((c, i) => {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(3.2 + i * 0.55, 0.045, 16, 160),
        new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.7, roughness: 0.4 })
      );
      ring.rotation.x = Math.PI / 2 + i * 0.5;
      ring.rotation.y = i * 0.8;
      group.add(ring);
      rings.push(ring);
    });

    // Pequenas esferas orbitando
    const orbiters = [];
    for (let i = 0; i < 5; i++) {
      const s = new THREE.Mesh(
        new THREE.SphereGeometry(0.14, 24, 24),
        new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x9d8bff, emissiveIntensity: 1.2 })
      );
      group.add(s);
      orbiters.push({ mesh: s, radius: 3 + Math.random() * 1.6, speed: 0.4 + Math.random() * 0.6, offset: Math.random() * Math.PI * 2, tilt: Math.random() * Math.PI });
    }

    // --- Campo de estrelas / particulas ---
    const starCount = 1400;
    const starPos = new Float32Array(starCount * 3);
    const starCol = new Float32Array(starCount * 3);
    const palette = [new THREE.Color(0x9d8bff), new THREE.Color(0x7afcff), new THREE.Color(0xff7eb3), new THREE.Color(0xffffff)];
    for (let i = 0; i < starCount; i++) {
      const r = 14 + Math.random() * 26;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      starPos[i*3+2] = r * Math.cos(phi);
      const col = palette[(Math.random() * palette.length) | 0];
      starCol[i*3] = col.r; starCol[i*3+1] = col.g; starCol[i*3+2] = col.b;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    starGeo.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 0.12, vertexColors: true, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending }));
    scene.add(stars);

    // --- Interacao com o mouse (parallax suave) ---
    const target = { x: 0, y: 0 };
    const current = { x: 0, y: 0 };
    window.addEventListener('pointermove', (e) => {
      target.x = (e.clientX / window.innerWidth - 0.5) * 2;
      target.y = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // Scroll altera levemente o zoom/angulo
    let scrollZoom = 0;
    window.addEventListener('wheel', (e) => {
      scrollZoom = THREE.MathUtils.clamp(scrollZoom + e.deltaY * 0.0015, -2.5, 3);
    }, { passive: true });

    // --- Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Loop de animacao ---
    const clock = new THREE.Clock();
    function animate() {
      const t = clock.getElapsedTime();

      // Rotacao do nucleo e wireframe
      core.rotation.x = t * 0.18;
      core.rotation.y = t * 0.25;
      wire.rotation.x = -t * 0.12;
      wire.rotation.y = t * 0.16;

      // Pulsar do nucleo
      const pulse = 1 + Math.sin(t * 1.6) * 0.04;
      core.scale.setScalar(pulse);

      // Aneis girando
      rings.forEach((ring, i) => {
        ring.rotation.z += 0.002 + i * 0.0015;
        ring.rotation.y += 0.001 + i * 0.0008;
      });

      // Esferas orbitando
      orbiters.forEach((o) => {
        const a = t * o.speed + o.offset;
        o.mesh.position.set(
          Math.cos(a) * o.radius,
          Math.sin(a * 0.8) * o.radius * Math.sin(o.tilt) * 0.6,
          Math.sin(a) * o.radius
        );
      });

      // Estrelas girando devagar
      stars.rotation.y = t * 0.02;
      stars.rotation.x = t * 0.008;

      // Luzes orbitando para brilho dinamico
      keyLight.position.x = Math.cos(t * 0.5) * 7;
      keyLight.position.z = Math.sin(t * 0.5) * 7;
      rimLight.position.x = Math.cos(t * 0.5 + Math.PI) * 7;

      // Parallax suave do grupo inteiro com o mouse
      current.x += (target.x - current.x) * 0.05;
      current.y += (target.y - current.y) * 0.05;
      group.rotation.y = current.x * 0.5;
      group.rotation.x = current.y * 0.4;

      // Camera reage ao scroll e ao mouse
      camera.position.z = 9 + scrollZoom;
      camera.position.x += (current.x * 1.2 - camera.position.x) * 0.05;
      camera.position.y += (-current.y * 1.0 - camera.position.y) * 0.05;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // Esconde o loader quando tudo estiver pronto
    window.addEventListener('load', () => {
      setTimeout(() => loader.classList.add('hidden'), 400);
    });
    // Fallback caso o evento load ja tenha passado
    setTimeout(() => loader.classList.add('hidden'), 1500);
  </script>
</body>
</html>
